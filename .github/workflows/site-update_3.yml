name: 사이트 자동 갱신 및 배포

on:
  schedule:
    - cron: "0 */3 * * *"  # 3시간마다 실행. 주기 바꾸려면 이 줄만 수정
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-atlas-source
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 패키지 설치
        run: npm ci

      - name: 증권사 리포트·뉴스 갱신
        run: node scripts/update-market-sources.mjs

      - name: 실적 데이터 갱신
        run: node scripts/update-earnings.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name "stock-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/market-sources.ts app/earnings-data.ts

          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi

          git commit -m "사이트 데이터 자동 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 비슷한 시간대에 다른 워크플로가 같이 push할 수 있어서, 실패하면
          # 몇 초 쉬었다가 최신 내용을 받아서(rebase) 다시 push를 시도한다.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패, 잠시 후 재시도합니다 ($i/5)"
            sleep $((RANDOM % 8 + 3))
          done

          echo "5번 재시도했지만 push 실패"
          exit 1

      - name: 빌드
        run: npm run build

      - name: Cloudflare에 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
